<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELC Essentials</title>
  <style>
    body {
      font-family: system-ui, Segoe UI, sans-serif;
      padding: 2rem 1.25rem 3rem;
      max-width: 52rem;
      margin: auto;
      line-height: 1.5;
      color: #222;
    }
    a { color: #006fbf; }
    h1 { font-size: 1.5rem; margin-top: 0; }
    h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    p.lead { font-size: 1.05rem; }
    .links { margin: 1.25rem 0 2rem; }
    figure {
      margin: 0 0 1.75rem;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 0.75rem 1rem 1rem;
      font-size: 0.95rem;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>ELC Essentials</h1>
  <p class="lead">Open-source browser extension for UGA D2L Brightspace: practice tests, course schedule, tasks, and a projected grade calculator.</p>
  <p class="links">
    <a href="https://github.com/matteo101man/elc-essentials-extension">Source code and full documentation on GitHub</a>
    &nbsp;·&nbsp;
    <a href="privacy.html">Privacy policy</a>
  </p>

  <h2>Screenshots</h2>

  <figure>
    <img src="https://raw.githubusercontent.com/matteo101man/elc-essentials-extension/main/store-screenshots/screenshot-1.png" alt="Course Schedule with today’s classes and a NOW indicator" width="1280" height="800">
    <figcaption><strong>Course Schedule.</strong> Import from Athena, view classes by day, see which meeting is in session, edit times, and download a calendar file.</figcaption>
  </figure>

  <figure>
    <img src="https://raw.githubusercontent.com/matteo101man/elc-essentials-extension/main/store-screenshots/screenshot-2.png" alt="Exam Builder with optional AI question generator" width="1280" height="800">
    <figcaption><strong>Exam Builder.</strong> Build practice exams manually or generate questions from study notes with your own OpenAI API key.</figcaption>
  </figure>

  <figure>
    <img src="https://raw.githubusercontent.com/matteo101man/elc-essentials-extension/main/store-screenshots/screenshot-3.png" alt="Projected Grade Calculator on the D2L grades page" width="1280" height="800">
    <figcaption><strong>Projected Grade Calculator.</strong> Adjust scores on the Grades page to preview a projected percentage. Simulations are local only.</figcaption>
  </figure>
</body>
</html>
