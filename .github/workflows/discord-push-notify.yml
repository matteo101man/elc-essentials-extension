name: Discord Push Notification

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.head_commit != null
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          HEAD_COMMIT_JSON: ${{ toJson(github.event.head_commit) }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set."
            exit 1
          fi

          FILE_COUNT=$(echo "$HEAD_COMMIT_JSON" | jq '((.added // []) + (.modified // []) + (.removed // [])) | length')
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)

          MESSAGE_TRUNC=$(echo "$MESSAGE" | head -c 1000)
          if [ "${#MESSAGE}" -gt 1000 ]; then
            MESSAGE_TRUNC="${MESSAGE_TRUNC}..."
          fi

          PAYLOAD=$(jq -n \
            --arg title "Push to ${REPO} (${BRANCH})" \
            --arg author "$AUTHOR" \
            --arg message "$MESSAGE_TRUNC" \
            --arg sha "$SHORT_SHA" \
            --arg url "$COMMIT_URL" \
            --arg files "${FILE_COUNT} files changed" \
            '{
              embeds: [{
                title: $title,
                color: 5814783,
                fields: [
                  {name: "Author", value: $author, inline: true},
                  {name: "Commit", value: ("[`" + $sha + "`](<" + $url + ">)"), inline: true},
                  {name: "Message", value: $message},
                  {name: "Changes", value: $files, inline: true}
                ]
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
